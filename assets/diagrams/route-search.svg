<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Fuel-constrained route search</title>
  <desc id="desc">The recursive route search checks fuel, expands the two nearest unvisited pools, joins the branches, and evaluates a destination candidate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dy="4" stdDeviation="6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="24" fill="#f8fafc"/>
  <text x="55" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Fuel-constrained route search</text>
  <text x="55" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">Each state carries position, elapsed time, remaining fuel, and the visited-pool set.</text>

  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="205" width="250" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="105" cy="250" r="18" fill="#dc2626"/>
    <text x="145" y="246" font-size="21" font-weight="700" fill="#0f172a">Current state</text>
    <text x="145" y="278" font-size="16" fill="#475569">(x, y), time, fuel, visited</text>

    <rect x="435" y="145" width="280" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="480" cy="195" r="18" fill="#facc15"/>
    <text x="520" y="191" font-size="20" font-weight="700" fill="#0f172a">Nearest unvisited pool</text>
    <text x="520" y="222" font-size="16" fill="#475569">Explore first</text>

    <rect x="435" y="315" width="280" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="480" cy="365" r="18" fill="#facc15"/>
    <text x="520" y="361" font-size="20" font-weight="700" fill="#0f172a">Second-nearest pool</text>
    <text x="520" y="392" font-size="16" fill="#475569">Explore second</text>

    <rect x="850" y="225" width="205" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="890" cy="270" r="18" fill="#16a34a"/>
    <text x="925" y="266" font-size="20" font-weight="700" fill="#0f172a">Destination</text>
    <text x="925" y="297" font-size="16" fill="#475569">Candidate route</text>
  </g>

  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 235C355 205 385 195 424 195" marker-end="url(#arrow)"/>
    <path d="M310 285C355 330 385 365 424 365" marker-end="url(#arrow)"/>
    <path d="M715 195C770 195 775 245 815 270"/>
    <path d="M715 365C770 365 775 315 815 290"/>
    <path d="M815 280H838" marker-end="url(#arrow)"/>
  </g>
  <circle cx="815" cy="280" r="7" fill="#2563eb"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="315" y="158" width="112" height="27" rx="13" fill="#eaf3ff"/>
    <text x="371" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">fuel &gt;= 0.2d</text>
    <rect x="315" y="337" width="112" height="27" rx="13" fill="#eaf3ff"/>
    <text x="371" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">fuel &gt;= 0.2d</text>

    <rect x="60" y="475" width="995" height="105" rx="18" fill="#eaf3ff" stroke="#b7d5f6"/>
    <text x="90" y="510" font-size="20" font-weight="700" fill="#123a67">State transition after reaching a pool of area A</text>
    <line x1="370" y1="525" x2="370" y2="560" stroke="#b7d5f6"/>
    <line x1="720" y1="525" x2="720" y2="560" stroke="#b7d5f6"/>
    <text x="90" y="548" font-size="17" font-weight="600" fill="#334155">Time</text>
    <text x="145" y="548" font-size="18" fill="#0f172a">t_next = t + 5d + A</text>
    <text x="400" y="548" font-size="17" font-weight="600" fill="#334155">Fuel</text>
    <text x="452" y="548" font-size="18" fill="#0f172a">O_next = O - 0.2d + 0.2A</text>
    <text x="750" y="548" font-size="17" font-weight="600" fill="#334155">Objective</text>
    <text x="832" y="548" font-size="16" fill="#0f172a">minimum feasible time</text>
  </g>
</svg>
